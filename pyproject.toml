[project]
name = "coda"
version = "0.1.0"
description = ""
authors = [{ name = "Sven Marcus", email = "sven.marcus@tu-braunschweig.de" }]
dependencies = [
  "django<6.1",
  "django-environ>=0.11.2",
  "psycopg>=3.1.12",
  "django-stubs-ext>=4.2.7",
  "httpx>=0.25.2",
  "argon2-cffi>=23.1.0",
  "gunicorn>=21.2.0",
  "psycopg2-binary>=2.9.9",
  "whitenoise>=6.6.0",
  "polars>=1.37",
  "pydantic>=2.9.2",
  "xlsx2csv>=0.8.4",
  "fastexcel>=0.12.0",
  "pydantic-extra-types>=2.10.2",
]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }

[project.optional-dependencies]
docs = [
  "sphinx>=8.0.2",
  "myst-parser>=4.0.0",
  "pydata-sphinx-theme>=0.15.4",
  "sphinx-autobuild>=2024.4.16",
  "sphinx-copybutton>=0.5.2",
]
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.scripts]
coverage = "pytest --cov"
unittests = "pytest -m 'not integration and not migration_test and not performance' --ff"
migrationtests = "pytest -m 'migration_test' --ff"
alltests = "pytest -vv"
# Code formatting and linting
format = "ruff format ."
format-check = "ruff format --check ."
lint = "ruff check ."
lint-fix = "ruff check --fix ."


[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR:$MYPY_CONFIG_FILE_DIR/src"
packages = ["coda", "tests"]

strict = true
check_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
show_error_codes = true

plugins = ["mypy_django_plugin.main", "pydantic.mypy"]

[[tool.mypy.overrides]]
# Django migrations should not produce any errors:
module = "*.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "environ"
ignore_missing_imports = true

[tool.django-stubs]
strict_settings = false
django_settings_module = "config.settings.production"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
markers = [
    "integration: mark test as integration test",
    "performance: mark test as performance test (may be slow)",
]

[tool.ruff]
target-version = "py313"

force-exclude = true
line-length = 100

src = ["src", "tests"]
extend-exclude = ["migrations"]

[tool.ruff.format]
# Ruff's formatter is Black-compatible by default
# These settings ensure consistency with Black's behavior
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[dependency-groups]
dev = [
    "mypy>=1.7.1",
    "pre-commit>=3.5.0",
    "ruff>=0.1.1",
    "djlint>=1.34.0",
    "pytest-django>=4.5.2",
    "django-stubs[compatible-mypy]>=5.2.9",
    "pytest-sugar>=0.9.7",
    "pytest-clarity>=1.0.1",
    "commitizen>=3.13.0",
    "Faker>=24.2.0",
    "pytest-cov>=5.0.0",
    "django-silk>=5.3.2",
    "django-test-migrations>=1.4.0",
]
