<!DOCTYPE html>
<!--
  PROTOTYPE — throwaway, never merge.
  Question: what should coda's budget UI surfaces show and do?
  Surfaces: Overview | Create/Edit | Review split | Transfer. Each has 2-3 structurally
  different variants, switchable via the floating bottom bar (or ← / → arrow keys).
  Static fake data; no persistence; no backend.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Budget UI Prototype — CODA</title>
<style>
  :root { --fg:#1c2430; --muted:#67707d; --border:#d7dbe1; --surface:#f6f7f9; --accent:#1d5bd6; --ok:#1a7f4b; --warn:#b56a00; --err:#b3261e; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 -apple-system, "Segoe UI", sans-serif; color:var(--fg); background:#fff; }
  header.app { display:flex; gap:16px; align-items:center; padding:10px 20px; border-bottom:2px solid var(--fg); }
  header.app .brand { font-weight:700; letter-spacing:.5px; }
  header.app .crumb { color:var(--muted); }
  header.app .proto-tag { margin-left:auto; background:var(--warn); color:#fff; font-size:11px; padding:2px 8px; border-radius:3px; font-weight:700; }
  nav.surfaces { display:flex; gap:4px; padding:10px 20px 0; border-bottom:1px solid var(--border); }
  nav.surfaces button { border:1px solid var(--border); border-bottom:none; background:var(--surface); padding:7px 14px; cursor:pointer; border-radius:6px 6px 0 0; color:var(--muted); }
  nav.surfaces button.active { background:#fff; color:var(--fg); font-weight:600; }
  main { padding:18px 20px 90px; }
  h2 { font-size:15px; margin:0 0 4px; }
  p.hint { color:var(--muted); margin:0 0 14px; font-size:12.5px; }
  table { border-collapse:collapse; width:100%; }
  th, td { border:1px solid var(--border); padding:6px 9px; text-align:right; font-variant-numeric:tabular-nums; }
  th { background:var(--surface); font-weight:600; text-align:right; }
  th.l, td.l { text-align:left; }
  tr.exceeded td { background:#fdeceb; }
  .chip { display:inline-block; padding:1px 8px; border-radius:9px; font-size:11.5px; font-weight:600; }
  .chip.ok { background:#e2f3e9; color:var(--ok); }
  .chip.exceeded { background:#fbdad7; color:var(--err); }
  .chip.pending { background:#fdf1dc; color:var(--warn); }
  .bar { height:10px; background:#e8ebef; border-radius:5px; overflow:hidden; display:flex; margin:4px 0; }
  .bar span { display:block; height:100%; }
  .bar .spent { background:#b3261e; } .bar .reserved { background:#b56a00; } .bar .free { background:#1a7f4b; }
  .legend { font-size:11.5px; color:var(--muted); }
  .legend i { display:inline-block; width:9px; height:9px; border-radius:2px; margin:0 3px 0 8px; }
  .card { border:1px solid var(--border); border-radius:8px; padding:14px; }
  .grid2 { display:grid; grid-template-columns:340px 1fr; gap:16px; }
  .grid-form { display:grid; grid-template-columns:1fr 1fr; gap:14px; max-width:820px; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 3px; }
  label:first-child { margin-top:0; }
  input, select { width:100%; padding:6px 8px; border:1px solid var(--border); border-radius:5px; font:inherit; }
  input[disabled] { background:var(--surface); color:var(--muted); }
  .fieldnote { font-size:11.5px; color:var(--muted); margin-top:2px; }
  .fieldnote.err { color:var(--err); font-weight:600; }
  .fieldnote.ok { color:var(--ok); }
  button.act { background:var(--accent); border:none; color:#fff; padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:600; }
  button.act[disabled] { background:#a9b4c4; cursor:not-allowed; }
  .splitrow { display:grid; grid-template-columns:2fr 1fr auto; gap:8px; align-items:center; margin-bottom:6px; }
  .ledger { width:100%; font-size:12.5px; }
  .ledger td { border:none; border-bottom:1px solid var(--border); padding:4px 6px; }
  .barswitch { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:10px;
    background:#111827; color:#fff; padding:8px 12px; border-radius:24px; box-shadow:0 4px 14px rgba(0,0,0,.35); z-index:50; }
  .barswitch button { background:none; border:none; color:#fff; font-size:16px; cursor:pointer; padding:2px 6px; }
  .barswitch .vlabel { font-size:12.5px; min-width:200px; text-align:center; }
  .expandable td.detail { background:var(--surface); text-align:left; }
  .kvs { display:grid; grid-template-columns:auto 1fr; gap:2px 14px; font-size:12.5px; }
  .kvs b { font-weight:600; }
  .money-neg { color:var(--err); font-weight:600; }
</style>
</head>
<body>
<header class="app">
  <span class="brand">CODA</span><span class="crumb">Funding Sources › Budgets</span>
  <span class="proto-tag">PROTOTYPE — throwaway</span>
</header>
<nav class="surfaces" id="surfaceNav"></nav>
<main id="main"></main>
<div class="barswitch">
  <button id="prevV" title="previous variant">←</button>
  <span class="vlabel" id="vlabel"></span>
  <button id="nextV" title="next variant">→</button>
</div>

<script>
// ---- fake data (grounded in the decided model) ----
const BUDGETS = [
  { id:1, name:"DARK 2026", period:"2026-01-01 → 2026-12-31", amount:120000, reserved:18000, spent:74200, credited:0, debit:0, pending:5200, pendingCur:"USD", allowOver:true, allowance:null },
  { id:2, name:"DFG-Förderung", period:"2025-07-01 → 2026-06-30", amount:80000, reserved:9200, spent:68400, credited:0, debit:0, pending:0, allowOver:false, allowance:null },
  { id:3, name:"APC Pool", period:"2026-01-01 → 2026-12-31", amount:50000, reserved:12400, spent:43100, credited:0, debit:3200, pending:0, allowOver:false, allowance:5000 },
  { id:4, name:"Speaker Funds (heritage)", period:"2024-01-01 → 2024-12-31", amount:15000, reserved:0, spent:16250, credited:0, debit:0, pending:0, allowOver:false, allowance:null },
];
const avail = b => b.amount - b.reserved - b.spent + b.credited - b.debit;
const committed = b => b.reserved + b.spent - b.credited + b.debit;
const exceeded = b => committed(b) > b.amount;
const eur = n => (n<0?"−":"") + "€" + Math.abs(n).toLocaleString("de-DE");
const chip = b => exceeded(b) ? '<span class="chip exceeded">exceeded</span>' : '<span class="chip ok">within budget</span>';

// ---- surfaces & variants ----
const SURFACES = {
  "Overview": {
    variants: {
      "A": { name:"Dense table", render: vA },
      "B": { name:"Master–detail", render: vB },
      "C": { name:"Expandable rows", render: vC },
    }
  },
  "Create / Edit": {
    variants: {
      "A": { name:"Single form, immutability inline", render: fA },
      "B": { name:"Two-column with live preview", render: fB },
    }
  },
  "Review split": {
    variants: {
      "A": { name:"Inline split rows", render: rA },
      "B": { name:"Allocation bars", render: rB },
    }
  },
  "Transfer": {
    variants: {
      "A": { name:"Dialog", render: tA },
      "B": { name:"Two-step with preview", render: tB },
    }
  },
};
let surface = "Overview", variant = "A";

// ---- Overview variants ----
function vA() {
  const rows = BUDGETS.map(b => `<tr class="${exceeded(b)?'exceeded':''}">
    <td class="l"><b>${b.name}</b></td><td class="l" style="color:var(--muted)">${b.period}</td>
    <td>${eur(b.amount)}</td><td>${eur(b.reserved)}</td><td>${eur(b.spent)}</td>
    <td>${eur(b.credited)}</td><td>${eur(b.debit)}</td>
    <td>${b.pending ? `<span class="chip pending">${eur(b.pending)} ${b.pendingCur}</span>` : "—"}</td>
    <td class="${avail(b)<0?'money-neg':''}"><b>${eur(avail(b))}</b></td>
    <td class="l">${chip(b)}</td></tr>`).join("");
  return `<h2>Budgets</h2><p class="hint">All states per budget at a glance. Exceeded rows tinted; pending conversion shown in its foreign currency, excluded from Available.</p>
  <table><thead><tr><th class="l">Budget</th><th class="l">Period</th><th>Amount</th><th>Reserved</th><th>Spent</th><th>Credited</th><th>Debit</th><th>Pending conv.</th><th>Available</th><th class="l">Status</th></tr></thead><tbody>${rows}</tbody></table>
  <p class="legend">Available = amount − reserved − spent + credited − debit. Pending conversion is excluded until the bank rate is entered.</p>`;
}
function vB() {
  const b = BUDGETS[0];
  const list = BUDGETS.map(x => `<tr class="l" style="cursor:pointer;${x.id===b.id?'background:var(--surface);font-weight:600':''}" onclick="alert('prototype: select ${x.name}')"><td>${x.name}</td><td class="l">${x.period}</td></tr>`).join("");
  const pct = n => Math.min(100, committed(b)/b.amount*100);
  const w = n => (n/b.amount*100).toFixed(1)+"%";
  return `<div class="grid2">
    <div><h2>Budgets</h2><table><thead><tr><th class="l">Name</th><th class="l">Period</th></tr></thead><tbody>${list}</tbody></table></div>
    <div class="card"><h2>${b.name} ${chip(b)}</h2>
      <p class="hint">${b.period} · allow over: ${b.allowOver ? (b.allowance==null?"yes, unbounded":"yes, up to "+eur(b.allowance)) : "no"}</p>
      <div class="bar"><span class="spent" style="width:${w(b.spent)}"></span><span class="reserved" style="width:${w(b.reserved)}"></span><span class="free" style="width:${Math.max(0,100-pct())}%"></span></div>
      <div class="legend"><i style="background:#b3261e"></i>spent ${eur(b.spent)}<i style="background:#b56a00"></i>reserved ${eur(b.reserved)}<i style="background:#1a7f4b"></i>available ${eur(avail(b))}</div>
      ${b.pending?`<p><span class="chip pending">pending conversion: ${eur(b.pending)} ${b.pendingCur}</span> <span class="legend">awaiting bank rate — not in Available</span></p>`:""}
      <h2 style="margin-top:18px;font-size:13px">Recent ledger entries</h2>
      <table class="ledger"><tr><td>2026-10-30</td><td>payment</td><td class="l">Invoice INV-2026-0841 · Genome Biology APC</td><td class="l" style="color:var(--err)">−€2,300</td></tr>
      <tr><td>2026-10-28</td><td>commitment</td><td class="l">FR #512 decided funding</td><td class="l" style="color:var(--warn)">−€4,500</td></tr>
      <tr><td>2026-10-12</td><td>transfer in</td><td class="l">from "APC Pool"</td><td class="l" style="color:var(--ok)">+€1,200 credited</td></tr></table>
    </div></div>`;
}
function vC() {
  const rows = BUDGETS.map((b,i) => `<tr class="${exceeded(b)?'exceeded':''}" style="cursor:pointer" onclick="this.nextElementSibling.toggleAttribute('hidden')">
    <td class="l"><b>${b.name}</b></td><td>${eur(b.amount)}</td><td>${eur(b.reserved)}</td><td>${eur(b.spent)}</td>
    <td class="${avail(b)<0?'money-neg':''}">${eur(avail(b))}</td><td class="l">${chip(b)}${b.pending?' <span class="chip pending">pend.</span>':''}</td><td style="color:var(--muted)">▸</td></tr>
    <tr hidden><td colspan="7" class="detail"><div class="kvs">
      <b>Period</b><span>${b.period}</span>
      <b>Credited / Debit</b><span>${eur(b.credited)} / ${eur(b.debit)}</span>
      <b>Pending conversion</b><span>${b.pending?eur(b.pending)+" "+b.pendingCur+" — awaiting bank rate":"—"}</span>
      <b>Over-budget rule</b><span>${b.allowOver?(b.allowance==null?"allowed, unbounded":"allowed up to "+eur(b.allowance)):"not allowed"}</span>
      <b>Ledger</b><span>32 entries — <a href="#" onclick="return false">view full history</a></span></div></td></tr>`).join("");
  return `<h2>Budgets</h2><p class="hint">Compact table; click a row for the full state inline.</p>
  <table><thead><tr><th class="l">Budget</th><th>Amount</th><th>Reserved</th><th>Spent</th><th>Available</th><th class="l">Status</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

// ---- Create/Edit variants ----
function fA() {
  const b = BUDGETS[0];
  return `<h2>Edit budget — ${b.name}</h2><p class="hint">Amount disabled because the period has started (immutable). Corrections happen via transfer or a new budget.</p>
  <div class="card" style="max-width:460px">
    <label>Budget name</label><input value="${b.name}"><div class="fieldnote">Must be unique among budgets.</div>
    <label>Amount (system currency)</label><input value="€120,000.00" disabled><div class="fieldnote err">Immutable — period started 2026-01-01. Move funds via Transfer.</div>
    <label>Period</label><input value="2026-01-01 → 2026-12-31"><div class="fieldnote">Editable. Only a reporting boundary — does not close the budget.</div>
    <label><input type="checkbox" style="width:auto" checked> Allow going over budget</label>
    <label>Overage allowance</label><input placeholder="empty = unbounded"><div class="fieldnote">Leave empty for unbounded; only applies when "allow going over" is set.</div>
    <p><button class="act">Save</button></p></div>`;
}
function fB() {
  return `<h2>Edit budget — DARK 2026</h2><p class="hint">Identity/period left, money rules right, with a live preview of what the rules mean.</p>
  <div class="grid-form">
    <div class="card"><h2 style="font-size:13px">Identity & period</h2>
      <label>Budget name</label><input value="DARK 2026">
      <label>Period start</label><input value="2026-01-01">
      <label>Period end</label><input value="2026-12-31">
      <div class="fieldnote ok">Period edits never change balances — attribution is by link, not dates.</div></div>
    <div class="card"><h2 style="font-size:13px">Money rules</h2>
      <label>Amount</label><input value="€120,000.00" disabled><div class="fieldnote err">Immutable since 2026-01-01.</div>
      <label><input type="checkbox" style="width:auto" checked> Allow going over</label>
      <label>Overage allowance</label><input placeholder="empty = unbounded">
      <h2 style="font-size:13px;margin-top:16px">Live state</h2>
      <div class="bar"><span class="spent" style="width:61.8%"></span><span class="reserved" style="width:15%"></span><span class="free" style="width:23.2%"></span></div>
      <div class="kvs"><b>Committed</b><span>€92,200</span><b>Available</b><span>€27,800</span><b>Pending conv.</b><span>$5,200 awaiting rate</span></div>
      <p><button class="act">Save</button></p></div></div>`;
}

// ---- Review split variants ----
function rA() {
  return `<h2>Review — FR #512 · publication "CRISPR screening in…"</h2>
  <p class="hint">Decided funding is attributed to budget(s) here. Capacity is checked live at commitment time.</p>
  <div class="card" style="max-width:640px">
    <label>Decided funding amount</label><input value="€4,500.00">
    <h2 style="font-size:13px;margin-top:14px">Funding attribution</h2>
    <div class="splitrow"><select><option>DARK 2026</option><option>APC Pool</option><option>DFG-Förderung</option></select>
      <input value="€3,000.00"><span class="fieldnote ok">fits (€27,800 available)</span></div>
    <div class="splitrow"><select><option>APC Pool</option><option>DARK 2026</option></select>
      <input value="€1,500.00"><span class="fieldnote err">exceeds APC Pool: only €1,200 available, over-budget not allowed</span></div>
    <p class="fieldnote">Split must sum to the decided amount. "Unpaid invoice wins" applies later: when an unpaid invoice exists, its assigned amount replaces this reservation.</p>
    <p><button class="act">Record decision</button> <button class="act" style="background:#a9b4c4" disabled>Blocked: fix attribution</button></p></div>`;
}
function rB() {
  return `<h2>Review — FR #512 · decided funding €4,500</h2>
  <p class="hint">Budgets shown as capacity bars; drag-down allocation (mock). Errors surface before saving.</p>
  <div class="card" style="max-width:680px">
    ${BUDGETS.slice(0,3).map(b=>{const free=avail(b);return `<div style="margin-bottom:12px">
      <div class="splitrow" style="grid-template-columns:2fr auto auto"><b class="l">${b.name}</b><span>${eur(free)} free</span>${exceeded(b)?'<span class="chip exceeded">exceeded</span>':''}</div>
      <div class="bar"><span class="spent" style="width:${(b.spent/b.amount*100).toFixed(1)}%"></span><span class="reserved" style="width:${(b.reserved/b.amount*100).toFixed(1)}%"></span><span class="free" style="width:${Math.max(0,100-(b.spent+b.reserved)/b.amount*100).toFixed(1)}%"></span></div>
      <div class="splitrow" style="grid-template-columns:2fr 1fr auto"><select><option>allocate from this budget</option></select><input value="${b.id===1?'€3,000.00':'€0.00'}"><span class="fieldnote ${b.id===1?'ok':'muted'}">${b.id===1?'fits':'—'}</span></div></div>`;}).join("")}
    <p class="fieldnote">Allocated: €3,000 of €4,500 — <b style="color:var(--err)">€1,500 unallocated</b></p>
    <p><button class="act" disabled>Record decision</button></p></div>`;
}

// ---- Transfer variants ----
function tA() {
  return `<h2>Transfer funds</h2><p class="hint">Debit on source, credited on target. Outgoing positive transfers obey the source's capacity rule; debt transfers from exceeded budgets are exempt.</p>
  <div class="card" style="max-width:480px">
    <label>From budget</label><select><option>APC Pool (€1,200 available)</option><option>DARK 2026 (€27,800 available)</option><option>DFG-Förderung (exceeded −€2,400)</option></select>
    <label>To budget</label><select><option>DARK 2026</option><option>APC Pool</option></select>
    <label>Amount</label><input value="€1,200.00"><div class="fieldnote">Negative amounts transfer an exceeded budget's overrun as debt (debit on target).</div>
    <label>Provenance note</label><input placeholder="e.g. closing 2025 APC pool">
    <p><button class="act">Transfer</button></p></div>`;
}
function tB() {
  return `<h2>Transfer — step 2 of 2: preview</h2><p class="hint">The write is previewed as the ledger rows it will create before anything is booked.</p>
  <div class="card" style="max-width:640px">
    <div class="kvs"><b>From</b><span>DFG-Förderung (exceeded)</span><b>To</b><span>DARK 2026</span><b>Amount</b><span class="money-neg">−€2,400 (debt transfer)</span></div>
    <h2 style="font-size:13px;margin-top:16px">Ledger rows this creates</h2>
    <table class="ledger">
      <tr><td>DFG-Förderung</td><td class="l">debit (debt transferred out)</td><td class="l" style="color:var(--err)">−€0 available change (already exceeded)</td><td class="l">overrun composition: 2 paid invoices</td></tr>
      <tr><td>DARK 2026</td><td class="l">debit (inherited debt)</td><td class="l" style="color:var(--err)">−€2,400 available</td><td class="l">source: DFG-Förderung</td></tr></table>
    <p class="fieldnote ok">DARK 2026 allows going over, so inheriting debt is permitted; it will display as exceeded.</p>
    <p><button class="act">Book transfer</button> <button class="act" style="background:#a9b4c4">Back</button></p></div>`;
}

// ---- switching machinery ----
const nav = document.getElementById("surfaceNav");
Object.keys(SURFACES).forEach(s => {
  const b = document.createElement("button");
  b.textContent = s; b.dataset.s = s;
  b.onclick = () => { surface = s; variant = Object.keys(SURFACES[s].variants)[0]; render(); };
  nav.appendChild(b);
});
function render() {
  document.getElementById("main").innerHTML = SURFACES[surface].variants[variant].render();
  nav.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.s === surface));
  document.getElementById("vlabel").textContent = `${variant} (${SURFACES[surface].variants[variant].name}) — ${surface}`;
}
function cycle(d) {
  const keys = Object.keys(SURFACES[surface].variants);
  variant = keys[(keys.indexOf(variant) + d + keys.length) % keys.length];
  render();
}
document.getElementById("prevV").onclick = () => cycle(-1);
document.getElementById("nextV").onclick = () => cycle(1);
document.addEventListener("keydown", e => {
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});
render();
</script>
</body>
</html>
