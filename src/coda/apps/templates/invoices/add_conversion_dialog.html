<dialog open>
    <article>
        <header>
            <h2>Add conversion</h2>
        </header>
        <div>
            <div class="my-2">
                <label for="currency">Target currency</label>
                <select id="currency" name="currency">
                    {% for currency in currencies %}<option value="{{ currency.code }}">{{ currency.code }}</option>{% endfor %}
                </select>
            </div>
            <div class="my-2">
                <label for="exchange_rate">Exchange Rate</label>
                <input type="number" id="exchange_rate" name="exchange_rate" required>
            </div>
        </div>
        <footer>
            <button hx-post="{% url 'invoices:add_conversion' pk=invoice_id %}"
                    hx-include="#currency, #exchange_rate"
                    hx-swap="outerHTML"
                    hx-target="#conversions">Save</button>
            <button class="danger" onclick="this.closest('dialog').remove()">Cancel</button>
        </footer>
    </article>
</dialog>
