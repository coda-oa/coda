{% extends "invoices/position_base.html" %}
{% block position_type %}
    Free Position
{% endblock position_type %}
{% block position_type_specifics %}
    <div class="form-row">
        <label for="id-positions-{{ counter }}-description" class="form-row-item-sm">Description</label>
        <input id="id-positions-{{ counter }}-description"
               type="text"
               name="positions-{{ counter }}-item-description"
               value="{{ position.item.description }}">
    </div>
{% endblock position_type_specifics %}
