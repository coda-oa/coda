<article class="flex justify-between align-center">
    <div>
        <p class="m-0">
            <a href="{% url 'invoices:fundingsource_detail' pk=entity.id %}">{{ entity.name }}</a>
        </p>
        <small>
            <span class="chip {{ entity.status.css_class }}">{{ entity.status.label }}</span>
            available: {{ entity.balance.available }}
            {% if entity.balance.pending %}
                · pending conversion:
                {% for amount in entity.balance.pending %}{{ amount }}{% if not forloop.last %}, {% endif %}{% endfor %}
            {% endif %}
        </small>
    </div>
    <a href="{% url "invoices:fundingsource_update" pk=entity.id %}"
       class="button secondary">Edit</a>
</article>
