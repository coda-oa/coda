<div class="grid">
    <div>
        <label for="free-position-description" class="mb-0_5">Position</label>
        <input type="text"
               id="free-position-item-description"
               name="free-position-item-description">
    </div>
    <div>
        <label for="free-position-item-cost_type" class="mb-0_5">Cost Type</label>
        <select id="free-position-item-cost_type"
                name="free-position-item-cost_type"
                hx-get="{% url 'invoices:free_position_cost_type_options' %}"
                hx-target="#free-position-tax-wrapper"
                hx-swap="innerHTML"
                hx-trigger="change"
                hx-include="#free-position-item-cost_type">
            {% for type in publication_cost_types %}<option value="{{ type }}">{{ type }}</option>{% endfor %}
        </select>
    </div>
    <div>
        <label for="free-position-cost_amount" class="mb-0_5">Amount</label>
        <input type="number"
               id="free-position-cost_amount"
               name="free-position-cost_amount"
               value="0"
               step="0.0001">
    </div>
    <div id="free-position-tax-wrapper">{% include "invoices/free_position_tax_rate.html" %}</div>
    <div>
        <button type="submit"
                class="mt-1_5 outline secondary invoice-position-add-button"
                name="action"
                value="add-free-position"
                hx-include="#invoice-form, #free-position-item-description,#free-position-item-cost_type,#free-position-cost_amount,#free-position-tax_rate"
                hx-post="{% url 'invoices:add_position' %}"
                hx-target="#positions"
                hx-swap="outerHTML">Add</button>
    </div>
</div>
