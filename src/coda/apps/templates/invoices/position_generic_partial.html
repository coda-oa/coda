<input type="hidden"
       name="position-{{ counter }}-type"
       value="{{ position.type }}">
<input type="hidden"
       name="position-{{ counter }}-id"
       value="{{ position.id }}">
<div class="grid">
    <div class="form-row">
        <label for="id-position-{{ counter }}-funding-source"
               class="form-row-item-sm">Funding Source</label>
        <select name="position-{{ counter }}-funding-source"
                id="id-position-{{ counter }}-funding-source">
            <option value>-------</option>
            {% for fs in funding_sources %}
                <option value="{{ fs.id }}"
                        {% if position.funding_source == fs.id %}selected{% endif %}>{{ fs.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-row">
        <label for="id-position-{{ counter }}-external-position-id">External Position ID</label>
        <input type="text"
               id="id-position-external-position-id"
               name="position-{{ counter }}-external-position-id"
               value="{{ position.external_position_id }}">
    </div>
</div>
<div class="common-position-grid">
    <div class="form-row amount">
        <label for="id-position-{{ counter }}-cost-amount" class="form-row-item-sm">Amount</label>
        <input type="number"
               id="id-position-{{ counter }}-cost-amount"
               name="position-{{ counter }}-cost-amount"
               min="0"
               max="1000000000000000"
               step="0.0001"
               value="{{ position.cost_amount }}">
    </div>
    <div class="form-row tax-rate">
        <label for="id-position-{{ counter }}-tax-rate" class="form-row-item-sm">Tax Rate</label>
        <input type="number"
               id="id-position-{{ counter }}-tax-rate"
               name="position-{{ counter }}-tax-rate"
               min="0"
               max="100"
               step="1"
               value="{{ position.tax_rate }}">
    </div>
    <div class="form-row cost-type">
        <label for="id-position-{{ counter }}-cost-type" class="form-row-item-sm">Cost Type</label>
        <select id="id-position-{{ counter }}-cost-type"
                name="position-{{ counter }}-cost-type">
            {% for type in cost_types %}
                <option value="{{ type }}"
                        {% if type == position.cost_type %}selected{% endif %}>{{ type }}</option>
            {% endfor %}
        </select>
    </div>
</div>
