{% extends "invoices/position_base.html" %}
{% block position_type %}
    Publication
{% endblock position_type %}
{% block position_type_specifics %}
    <h4>
        Publication Title:
        <a href="{{ position.funding_request.url }}"
           target="_blank"
           class="outline secondary">{{ position.title }} ↗</a>
    </h4>
    {% if position.funding_request.url %}
        <input type="hidden"
               name="position-{{ counter }}-fundingrequest-id"
               value="{{ position.funding_request.request_id }}">
        <input type="hidden"
               name="position-{{ counter }}-fundingrequest-url"
               value="{{ position.funding_request.url }}">
    {% endif %}
    <input type="hidden"
           name="position-{{ counter }}-title"
           value="{{ position.title }}">
{% endblock position_type_specifics %}
