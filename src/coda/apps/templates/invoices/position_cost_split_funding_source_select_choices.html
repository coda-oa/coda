{% if funding_source_type == "budget" %}
    <option value>-------</option>
    {% for fs in funding_sources %}
        <option value="{{ fs.id }}"
                {% if split.funding_source == fs.id %}selected{% endif %}>{{ fs.name }}</option>
    {% endfor %}
{% else %}
    {% for inst in institutions %}
        <option value="{{ inst.id }}"
                {% if split.funding_source == inst.id %}selected{% endif %}>{{ inst.name }}</option>
    {% endfor %}
{% endif %}
