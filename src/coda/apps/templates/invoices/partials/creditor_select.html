<search-select name="creditor" id="id_creditor"
{% if required %}required{% endif %}
>
<li value="">---------</li>
{% for creditor in creditors %}
    <li value="{{ creditor.id }}"
        {% if selected_creditor_id == creditor.id %}selected{% endif %}>{{ creditor.name }}</li>
{% endfor %}
</search-select>
