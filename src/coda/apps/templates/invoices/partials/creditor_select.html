<search-select name="creditor" id="id_creditor"
{% if required %}required{% endif %}
{% if has_errors %}aria-invalid="true"{% endif %}
>
<li value="" {% if not selected_creditor_id %}selected{% endif %}>---------</li>
{% for creditor in creditors %}
    <li value="{{ creditor.pk }}"
        {% if selected_creditor_id|stringformat:"s" == creditor.pk|stringformat:"s" %}selected{% endif %}>
        {{ creditor.name }}
    </li>
{% endfor %}
</search-select>
