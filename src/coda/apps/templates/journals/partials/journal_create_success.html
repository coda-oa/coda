<div id="entity-creation-modal-wrapper" hx-swap-oob="true"></div>
<div id="journal-search-results"
     hx-swap-oob="true"
     class="scroll-container max-h-30">
    <table class="my-2">
        <thead>
            <tr>
                <th>Title</th>
                <th>Publisher</th>
                <th>Select</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>{{ journal.title }}</td>
                <td>{{ journal.publisher.name }}</td>
                <td>
                    <input type="radio" name="journal" value="{{ journal.pk }}" checked>
                </td>
            </tr>
        </tbody>
    </table>
</div>
<input type="search"
       name="journal_title"
       id="journal_title"
       hx-swap-oob="true"
       value="{{ journal.title }}">
