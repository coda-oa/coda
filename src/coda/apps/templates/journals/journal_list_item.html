<article class="flex justify-between align-center">
    <div>
        <p>
            <a href="{{ entity.detail_url }}">{{ entity.title }}</a>
        </p>
        <p>EISSN: {{ entity.eissn }}</p>
        <p>
            Publisher:
            <a href="{{ entity.publisher_url }}">{{ entity.publisher_name }}</a>
        </p>
        {% if entity.is_blocked %}
            <p class="mb-0_5">
                <span class="label danger">{{ entity.block_reason_display }}</span>
            </p>
        {% endif %}
    </div>
    <div>
        {% if entity.is_blocked %}
            <button type="button"
                    class="my-0 outline success"
                    hx-post="{% url "blocklist:unblock_journal" pk=entity.id %}">Unblock</button>
        {% else %}
            <button type="button"
                    class="my-0 outline danger"
                    hx-target="body"
                    hx-swap="beforeend"
                    hx-push-url="false"
                    hx-get="{% url "blocklist:request_block_journal" pk=entity.id %}">Block</button>
        {% endif %}
        <a href="{{ entity.update_url }}"
           role="button"
           class="secondary">Edit</a>
    </div>
</article>
