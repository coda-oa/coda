{% extends "base.html" %}
{% block content %}
    <div class="flex justify-between align-center my-2">
        <hgroup class="mb-0">
            <h1>Journal</h1>
            <p>{{ journal.title }}</p>
        </hgroup>
        <div class="flex align-center">
            {% if is_blocked %}
                <button class="outline success"
                        hx-post="{% url "blocklist:unblock_journal" pk=journal.pk %}"
                        hx-vals='{"redirect_url": "{% url "publishing:journals:detail" eissn=journal.eissn %}" }'>
                    Unblock
                </button>
            {% else %}
                <button class="outline danger"
                        hx-get="{% url "blocklist:request_block_journal" pk=journal.pk %}"
                        hx-target="body"
                        hx-swap="beforeend">Block</button>
            {% endif %}
            <a href="{% url "publishing:journals:update" eissn=journal.eissn %}"
               role="button"
               class="secondary">Edit</a>
        </div>
    </div>
    <article>
        <header>
            <h2 class="mb-0">Journal metadata</h2>
        </header>
        <p>E-ISSN: {{ journal.eissn }}</p>
        <p class="mb-0">
            Publisher:
            <a href="{{ journal.publisher.get_absolute_url }}">{{ journal.publisher.name }}</a>
        </p>
    </article>
    {% include "partials/related_funding_requests.html" %}
{% endblock content %}
