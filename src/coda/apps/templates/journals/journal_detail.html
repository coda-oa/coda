{% extends "base.html" %}
{% block content %}
    <div class="flex justify-between align-center">
        <h1 class="my-2">Journal</h1>
        <a href="{% url "journals:update" eissn=journal.eissn %}"
           role="button"
           class="secondary">Edit</a>
    </div>
    <article>
        <header>
            <h2 class="my-0">{{ journal.title }}</h2>
        </header>
        <p>E-ISSN: {{ journal.eissn }}</p>
        <p class="mb-0">Publisher: {{ journal.publisher.name }}</p>
    </article>
{% endblock content %}
