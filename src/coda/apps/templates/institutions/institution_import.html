{% extends "base.html" %}
{% block page_title %}Import Institutions{% endblock page_title %}
{% block content %}
    <article>
        <form action="{% url "institutions:import" %}"
              method="post"
              enctype="multipart/form-data"
              class="flex justify-center align-center ">
            {% csrf_token %}
            <input type="file"
                   name="institution-list"
                   id="id-institution-list"
                   class="m-0"
                   accept=".csv">
            <button class="m-0" type="submit">Import</button>
        </form>
    </article>
{% endblock content %}
