{% extends "base.html" %}
{% block title %}
    {{ title }}
{% endblock title %}
{% block content %}
    <section class="my-2">
        {% if title %}<h1>{{ title }}</h1>{% endif %}
        <form method="post">
            <article>
                {% csrf_token %}
                <table class="article__table">
                    {{ form.as_div }}
                </table>
                <button type="submit" class="max-fit-content">Save</button>
            </article>
        </form>
    </section>
{% endblock content %}
