<div class="filter-toolbar align-top">
    <input type="search"
           name="search_term"
           value="{{ request.GET.search_term }}"
           placeholder="{{ filter_toolbar_search_placeholder }}"
           {% if filter_toolbar_search_aria_label %}aria-label="{{ filter_toolbar_search_aria_label }}"{% endif %}
           class="filter-search">
    <label class="filter-sort-label" for="sort_by">
        Sort
        <select name="sort_by" id="sort_by" class="filter-sort">
            <option value="date_desc"
                    {% if request.GET.sort_by == "date_desc" or not request.GET.sort_by %}selected{% endif %}>
                Date descending
            </option>
            <option value="date_asc"
                    {% if request.GET.sort_by == "date_asc" %}selected{% endif %}>Date ascending</option>
            <option value="alphabetical"
                    {% if request.GET.sort_by == "alphabetical" %}selected{% endif %}>Alphabet</option>
        </select>
    </label>
    <button type="button"
            id="filter-drawer-toggle"
            class="filter-drawer-toggle"
            aria-controls="filter-sidebar"
            aria-expanded="false">
        Filters
        {% include "partials/filter_toolbar_count.html" %}
    </button>
    {% if filter_toolbar_extra_template %}
        {% include filter_toolbar_extra_template %}
    {% endif %}
</div>
