<li class="nav__group{% if group_active %} nav__group--active{% endif %}">
    <input type="checkbox"
           id="nav-group-toggle-{{ key }}"
           class="nav__group-toggle"
           aria-label="Toggle {{ text }} section"
           {% if group_active %}checked{% endif %}>
    {% include "partials/nav_link.html" with link=link image=image text=text match="exact" path=path %}
    <label for="nav-group-toggle-{{ key }}" class="nav__group-toggle-label">
        <svg xmlns="http://www.w3.org/2000/svg"
             width="16"
             height="16"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round"
             aria-hidden="true"
             focusable="false">
            <path d="m9 18 6-6-6-6" />
        </svg>
    </label>
    <div class="nav__submenu-wrapper">
        <ul class="nav__submenu">
            {% for item in items %}
                <li>
                    <a href="{% url item.link %}"
                       class="contrast nav__sublink{% if item.active %} active{% endif %}"
                       {% if item.active %}aria-current="page"{% endif %}>
                        <span>{{ item.text }}</span>
                    </a>
                </li>
            {% endfor %}
        </ul>
    </div>
</li>
