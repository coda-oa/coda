<dialog open>
    <article>
        <header class="flex justify-between align-center mb-1">
            <h2 class="my-1">Delete {{ entity_type }}?</h2>
            <button aria-label="Close"
                    class="close"
                    onclick="this.closest('dialog').remove()"></button>
        </header>
        <div class="my-2">
            <p>
                Are you sure you want to permanently delete <strong>{{ entity_name }}</strong>?
            </p>
            <p>
                <strong>This action cannot be undone.</strong>
            </p>
        </div>
        <footer class="grid">
            <button type="button"
                    class="secondary"
                    onclick="this.closest('dialog').remove()">Cancel</button>
            <button type="button"
                    class="danger"
                    hx-post="{{ delete_url }}"
                    hx-target="closest dialog">Delete</button>
        </footer>
    </article>
</dialog>
