<ul class="undecorated {{ list_layout_classes }}">
    {% for entity in entities %}
        <li>{% include list_item_template %}</li>
    {% endfor %}
</ul>
{% if entities|length == 0 %}
    <p class="my-2">
        {% if query %}
            No results found for "{{ query }}".
        {% else %}
            No items to display.
        {% endif %}
    </p>
{% endif %}
