{% extends "forms/wizardform.html" %}
{% block wizard_step %}
    <h1>New Funding Request</h1>
    <article>
        <h2>Separate contact information</h2>
        <p>Additional contact information in case communication for this funding request is not handled by the authors.</p>
        <div class="mt-2">{{ form.as_div }}</div>
    </article>
    <article>
        <h2>Remarks by Request Submitter</h2>
        <textarea name="request_remarks" rows="10">{{ request_remarks }}</textarea>
    </article>
{% endblock wizard_step %}
