{% extends "forms/wizardform.html" %}
{% block wizard_step %}
    <article>
        <header class="flex justify-between align-center">
            <h2 class="fundingrequest__detail-title">Estimated Publication Cost</h2>
        </header>
        <table>
            <tbody>
            {{ cost_form.as_table }}
            </tbody>
        </table>
    </article>
    {% if funding_request_pk %}
        <div hx-get="{% url 'fundingrequests:apc_panel' pk=funding_request_pk %}"
             hx-trigger="load"
             hx-swap="outerHTML">
            <span aria-busy="true">Loading APC data…</span>
        </div>
    {% endif %}
    <article>
        <header class="flex justify-between align-center">
            <h2 class="fundingrequest__detail-title">External Research Funding</h2>
        </header>
        <button class="secondary"
                hx-get="{% url 'fundingrequests:funders_create_modal' %}"
                hx-target="#entity-creation-modal-wrapper"
                hx-swap="innerHTML"
                hx-include="#wizard-form">Create New Funding Organization
        </button>
        <div id="entity-creation-modal-wrapper"></div>
        <div id="funding-formset">{{ funding_formset.as_inline }}</div>
    </article>

{% endblock wizard_step %}
