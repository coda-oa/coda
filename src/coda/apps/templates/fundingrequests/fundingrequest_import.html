{% extends "base.html" %}
{% block content %}
    <h1 class="my-2">Import Funding Requests</h1>
    <article>
        <form action="{% url "fundingrequests:import" %}"
              method="post"
              enctype="multipart/form-data">
            {% csrf_token %}
            {{ form }}
            <div class="grid align-center">
                <a href="{% url "fundingrequests:list" %}"
                   class="secondary"
                   role="button">Cancel</a>
                <button class="m-0" type="submit">Import</button>
            </div>
        </form>
    </article>
    {% if import_errors %}
        <section>
            <h2 class="my-2">Import Errors</h2>
            <textarea rows="10" readonly>
{{ import_errors|join:"&#10;" }}
            </textarea>
        </section>
    {% endif %}
    <details>
        <summary role="button">JSON Schema</summary>
        <p>
            <a class="outline"
               href="{% url "fundingrequests:import_schema_download" %}">Download schema (JSON)</a>
        </p>
        <pre><code hx-get="{% url "fundingrequests:import_schema" %}"
                   hx-trigger="load"
                   hx-swap="innerHTML">Loading schema…</code></pre>
    </details>

{% endblock content %}
