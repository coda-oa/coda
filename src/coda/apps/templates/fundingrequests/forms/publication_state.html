{% load getlist %}
<div class="form-row">
    <label for="id_publication_states">Publication State</label>
    <search-select-multi name="publication_states" class="w-100" id="id_publication_states">
    {% for value, label in publication_states %}
        <option slot="options"
                value="{{ value }}"
                {% if value in request.GET|getlist:"publication_states" %}selected{% endif %}>{{ label }}</option>
    {% endfor %}
    </search-select-multi>
</div>
