<div class="coda-label-pills" id="label-pills" hx-swap-oob="true">
    {% for label_id in label_state %}<input type="hidden" name="labels" value="{{ label_id }}">{% endfor %}
    {% for pill in label_pills %}
        <a class="label pill label-filter-pill {{ pill.state }}"
           href="{{ pill.toggle_url }}"
           hx-get="{{ pill.toggle_fragment_url }}"
           hx-target="#fundingrequest-list"
           hx-push-url="{{ pill.toggle_url }}"
           title="Toggle label filter"
           style="--label-bg-color: {{ pill.color }};
                  --label-border-color: {{ pill.color }}">{{ pill.name }}</a>
    {% endfor %}
</div>
