<div class="coda-label-pills" hx-boost="true">
    {% for pill in label_pills %}
        <a class="label pill label-filter-pill {{ pill.state }}"
           href="{{ pill.toggle_url }}"
           title="Toggle label filter"
           style="--label-bg-color: {{ pill.color }};
                  --label-border-color: {{ pill.color }}">{{ pill.name }}</a>
    {% endfor %}
</div>
