{# Context: journal, selected_journal #}
<tr>
    <td>{{ journal.title }}</td>
    <td>{{ journal.publisher.name }}</td>
    <td>
        <input type="radio"
               name="journal"
               hx-target="#journal-error"
               hx-swap="outerHTML"
               hx-post="{% url 'fundingrequests:clear_journal_error' %}"
               value="{{ journal.pk }}"
               {% if journal.pk == selected_journal.pk %}checked{% endif %}>
    </td>
</tr>
