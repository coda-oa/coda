{# Context: journal, selected_journal #}
<tr>
    <td>
        <label for="journal-{{ journal.pk }}">{{ journal.title }}</label>
    </td>
    <td>{{ journal.publisher.name }}</td>
    <td>
        <input type="radio"
               id="journal-{{ journal.pk }}"
               name="journal"
               value="{{ journal.pk }}"
               {% if journal.pk == selected_journal.pk %}checked{% endif %}>
    </td>
</tr>
