{# Context: publishers, search_term, row_template #}
<div id="publisher-search-results" class="scroll-container max-h-30">
    {% if publishers %}
        <table>
            <thead>
            <tr>
                <th>Name</th>
                <th>Select</th>
            </tr>
            </thead>
            <tbody>
            {% for publisher in publishers %}
                {% include row_template|default:"fundingrequests/partials/publisher_row.html" %}
            {% endfor %}
            </tbody>
        </table>
    {% elif search_term %}
        <p>No publishers found for "{{ search_term }}".</p>
    {% endif %}
    <div class="flex justify-between align-center mt-2">
        <button type="button"
                hx-get="{% url 'publishing:publishers:create_modal' %}"
                hx-target="#entity-creation-modal-wrapper"
                class="secondary">New Publisher
        </button>
    </div>
    <div id="entity-creation-modal-wrapper"></div>
</div>
