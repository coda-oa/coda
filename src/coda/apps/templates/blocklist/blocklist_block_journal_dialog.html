<dialog open>
    <article>
        <header>
            <h1>Block Journal</h1>
        </header>
        <p>
            Are you sure you want to add the journal <strong>{{ journal.title }}</strong> to the blocklist?
        </p>
        <p>
            <select name="reason">
                {% for reason in blockreasons %}<option value="{{ reason.0 }}">{{ reason.1 }}</option>{% endfor %}
            </select>
        </p>
        <footer>
            <button type="button"
                    class="danger"
                    hx-post="{% url "blocklist:block_journal" pk=journal.pk %}"
                    hx-include="select[name=reason]"
                    hx-target="closest dialog"
                    hx-swap="outerHTML">Block</button>
            <button type="button"
                    class="secondary"
                    onclick="this.closest('dialog').remove()">Cancel</button>
        </footer>
    </article>
</dialog>
