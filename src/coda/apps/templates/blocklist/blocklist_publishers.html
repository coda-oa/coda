<div>
    {% include "blocklist/blocklist_section_header.html" with section_title="Publishers" section_block_url="publishing:publishers:list" section_block_label="Block Publishers" %}
    {% for publisher in publishers %}
        <article class="flex justify-between align-center">
            <p class="my-0">{{ publisher.publisher.name }}</p>
            <button type="button"
                    class="my-0 secondary"
                    hx-post="{% url "blocklist:unblock_publisher" pk=publisher.publisher.pk %}"
                    hx-target="closest article"
                    hx-swap="delete">Unblock</button>
        </article>
    {% endfor %}
</div>
