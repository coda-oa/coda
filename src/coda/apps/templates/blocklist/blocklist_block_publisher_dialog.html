<dialog open>
    <article>
        <header>
            <h1 class="my-0">Block Publisher</h1>
        </header>
        <p>
            Are you sure you want to add the publisher <strong>{{ publisher.name }}</strong> to the blocklist?
        </p>
        <footer>
            <button type="button"
                    class="my-0 danger"
                    hx-post="{% url "blocklist:block_publisher" pk=publisher.id %}"
                    hx-target="closest dialog"
                    hx-swap="outerHTML">Block</button>
            <button type="button"
                    class="my-0 secondary"
                    onclick="this.closest('dialog').remove()">Cancel</button>
        </footer>
    </article>
</dialog>
