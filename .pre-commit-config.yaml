exclude: '^docs/|/migrations/|devcontainer.json|^tests/database/opencost/backfill_goldens/'
default_stages: [pre-commit]

default_language_version:
  python: python3.15

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: detect-private-key

  - repo: https://github.com/adamchainz/django-upgrade
    rev: '1.30.0'
    hooks:
      - id: django-upgrade
        args: ['--target-version', '6.0']

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.22.0
    hooks:
      - id: pyupgrade
        # --py315-plus (pyupgrade v3.22.0) rewrites chain.from_iterable(genexp) into a
        # starred genexp with scrambled clause order -> NameError at runtime
        # (e.g. src/coda/apps/opencost/report_service.py). Re-enable only after
        # upstream fixes the rewrite.
        args: [--py314-plus]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 'v2.4.1'
    hooks:
      - id: mypy
        args: [--strict, --ignore-missing-imports]
        additional_dependencies:
          [
            'django<6.1',
            'django-test-migrations',
            'django-stubs[compatible-mypy]',
            'django-environ',
            'django-htmx',
            'django-silk',
            'faker',
            'httpx',
            'psycopg',
            'opencost>=0.1.1',
            'pytest',
            'pytest-django',
            'polars',
            'pydantic',
            'pydantic-extra-types',
            'pytest-playwright',
          ]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/Riverside-Healthcare/djLint
    rev: v1.36.4
    hooks:
      - id: djlint-reformat-django
        args: ['--extension=html']
      - id: djlint-django

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.13.9
    hooks:
      - id: commitizen
      - id: commitizen-branch
        stages: [pre-push]

# sets up .pre-commit-ci.yaml to ensure pre-commit dependencies stay up to date
ci:
  autoupdate_schedule: weekly
  skip: []
  submodules: false
